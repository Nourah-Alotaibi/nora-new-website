<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nourah Alotaibi</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Poppins', system-ui, sans-serif; background: #060418; overflow-x: hidden; }

  /* ============ HERO ============ */
  .hero {
    position: relative;
    min-height: 100svh; /* use svh so mobile browser chrome is excluded */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 5rem 1rem 5.5rem; /* bottom pad = room for scroll indicator */
    background:
      radial-gradient(ellipse 80% 45% at 50% 100%, rgba(126,34,206,.45), transparent 70%),
      linear-gradient(180deg, #060418 0%, #0d0630 55%, #180a3d 100%);
    overflow: hidden;
  }

  /* ============ GRID FLOOR ============ */
  .grid-wrap {
    position: absolute; left: -60%; right: -60%; bottom: 0;
    height: 18%;
    perspective: 150px; perspective-origin: 50% 0%; z-index: 1;
  }
  .grid {
    position: absolute; inset: 0;
    transform: rotateX(74deg); transform-origin: 50% 0%;
    background-image:
      repeating-linear-gradient(90deg, rgba(168,85,247,.7) 0px, rgba(168,85,247,.7) 3px, transparent 3px, transparent 80px),
      repeating-linear-gradient(0deg, rgba(147,51,234,.6) 0px, rgba(147,51,234,.6) 2px, transparent 2px, transparent 60px);
    filter: drop-shadow(0 0 6px rgba(168,85,247,.6)) drop-shadow(0 0 14px rgba(126,34,206,.35));
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.4) 20%, #000 50%, #000 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.4) 20%, #000 50%, #000 100%);
    animation: roll 2.6s linear infinite;
  }
  @keyframes roll { from { background-position: 0 0, 0 0; } to { background-position: 0 0, 0 60px; } }

  /* ============ STARS ============ */
  .stars {
    position: absolute; inset: 0 0 18% 0; z-index: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, #fff, transparent),
      radial-gradient(1px 1px at 28% 48%, #e9d5ff, transparent),
      radial-gradient(2px 2px at 41% 14%, #fff, transparent),
      radial-gradient(1px 1px at 58% 36%, #ddd6fe, transparent),
      radial-gradient(1.5px 1.5px at 71% 18%, #fff, transparent),
      radial-gradient(1px 1px at 83% 52%, #ddd6fe, transparent),
      radial-gradient(2px 2px at 91% 28%, #fff, transparent),
      radial-gradient(1px 1px at 6% 60%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 35% 68%, #e9d5ff, transparent),
      radial-gradient(1px 1px at 64% 72%, #fff, transparent),
      radial-gradient(1px 1px at 19% 8%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 77% 62%, #fff, transparent);
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }

  /* ============ INNER LAYOUT ============ */
  .inner {
    position: relative; z-index: 5;
    width: 100%; max-width: 420px;
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
    gap: 0; /* controlled per-child with margin */
  }

  /* ============ ORB ============ */
  .orb-wrap { position: relative; display: grid; place-items: center; }

  .orb {
    position: relative;
    /* fluid size: 240px on 320px screen → 285px on 420px+ screen */
    width: clamp(240px, 72vw, 285px);
    height: clamp(240px, 72vw, 285px);
    border-radius: 50%;
    display: grid; place-items: end center;
    background:
      radial-gradient(circle at 50% 35%, rgba(192,132,252,.35), rgba(88,28,135,.5) 55%, rgba(20,6,45,.9) 100%);
    box-shadow:
      0 0 0 2px rgba(216,180,254,.85),
      0 0 22px 3px rgba(192,132,252,.9),
      0 0 60px 12px rgba(168,85,247,.7),
      0 0 110px 28px rgba(147,51,234,.45),
      inset 0 0 40px rgba(216,180,254,.3);
    animation: pulse 3.6s ease-in-out infinite;
    overflow: hidden;
  }
  @keyframes pulse {
    0%, 100% { box-shadow:
      0 0 0 2px rgba(216,180,254,.85),
      0 0 22px 3px rgba(192,132,252,.9),
      0 0 60px 12px rgba(168,85,247,.7),
      0 0 110px 28px rgba(147,51,234,.45),
      inset 0 0 40px rgba(216,180,254,.3); }
    50% { box-shadow:
      0 0 0 2px rgba(240,230,255,1),
      0 0 34px 6px rgba(216,180,254,1),
      0 0 90px 22px rgba(168,85,247,.9),
      0 0 160px 42px rgba(147,51,234,.6),
      inset 0 0 55px rgba(216,180,254,.45); }
  }

  /* rotating specular sheen */
  .orb::before {
    content: ''; position: absolute; inset: -30%;
    background: conic-gradient(from 0deg,
      transparent 0deg, rgba(255,255,255,.28) 30deg,
      transparent 80deg, transparent 250deg,
      rgba(216,180,254,.22) 300deg, transparent 340deg);
    animation: sweep 7s linear infinite;
    pointer-events: none; z-index: 3;
  }
  @keyframes sweep { to { transform: rotate(360deg); } }

  /* glass highlight */
  .orb::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 32% 22%, rgba(255,255,255,.4), transparent 42%);
    pointer-events: none; z-index: 4;
  }

  .orb img {
    position: relative; z-index: 2;
    height: 96%; width: auto; object-fit: contain; object-position: bottom;
  }

  /* outer dashed halo — scaled to match orb */
  .halo {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: clamp(285px, 85vw, 330px);
    height: clamp(285px, 85vw, 330px);
    border-radius: 50%;
    border: 1px dashed rgba(192,132,252,.4);
    animation: spin 26s linear infinite; pointer-events: none;
  }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  /* ============ TEXT ============ */
  .greeting {
    margin-top: 1.5rem;
    font-size: 0.75rem;
    font-weight: 700; letter-spacing: -.01em;
    color: rgba(255,255,255,.95);
    text-shadow: 0 0 22px rgba(216,180,254,.5);
  }

  .name {
    font-size: clamp(2.5rem, 10vw, 3.5rem);
    font-weight: 800; line-height: 1.08; letter-spacing: -.02em;
    background: linear-gradient(180deg, #f3e8ff 0%, #d8b4fe 40%, #a855f7 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 24px rgba(168,85,247,.6));
  }
  .wave { -webkit-text-fill-color: initial; color: initial; display: inline-block; }

  /* ============ PILL ============ */
  .pill {
    margin-top: 1.1rem;
    display: flex; align-items: center; flex-wrap: wrap;
    justify-content: center; gap: .5rem .6rem;
    padding: .6rem 1rem;
    font-size: clamp(.72rem, 2.8vw, .82rem); color: #ede9fe;
    border: 1.5px solid rgba(192,132,252,.5); border-radius: 999px;
    background: rgba(30,10,60,.45);
    box-shadow: 0 0 20px rgba(168,85,247,.25);
    backdrop-filter: blur(6px);
    max-width: 100%;
  }
  .divider { color: rgba(192,132,252,.5); }

  /* ============ CTA BUTTON ============ */
  .cta {
    margin-top: 1.35rem;
    display: flex; align-items: center; justify-content: center; gap: .6rem;
    width: 100%; max-width: 290px;
    min-height: 54px; /* accessible touch target */
    padding: 0 1.75rem;
    font: inherit; font-size: clamp(.92rem, 3.5vw, 1rem); font-weight: 600; color: #fff;
    background: linear-gradient(90deg, #9333ea, #7e22ce);
    border: 1.5px solid rgba(216,180,254,.7); border-radius: 999px;
    box-shadow: 0 0 26px rgba(147,51,234,.6), inset 0 0 18px rgba(255,255,255,.1);
    cursor: pointer; transition: box-shadow .25s, transform .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .cta:hover { box-shadow: 0 0 44px rgba(168,85,247,.85), inset 0 0 18px rgba(255,255,255,.16); }
  .cta:active { transform: scale(.97); }

  /* ============ SCROLL INDICATOR ============ */
  .scroll {
    position: absolute; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: .15rem;
    z-index: 5;
  }
  .scroll span:first-child { font-size: .58rem; letter-spacing: .3em; color: rgba(216,180,254,.55); white-space: nowrap; }
  .chev { font-size: 1.3rem; line-height: .8; color: #c084fc; animation: drop 1.8s ease-in-out infinite; }
  .chev:nth-of-type(3) { animation-delay: .25s; opacity: .5; }
  @keyframes drop { 0%, 100% { transform: translateY(0); opacity: .55; } 50% { transform: translateY(6px); opacity: 1; } }

  /* ============ EXTRA-SMALL PHONES (< 360px) ============ */
  @media (max-width: 359px) {
    .hero { padding-top: 4.5rem; }
    .pill { font-size: .68rem; padding: .5rem .85rem; }
    .cta { max-width: 260px; }
  }

  /* ============ DESKTOP (>= 768px) ============ */
  @media (min-width: 768px) {
    .hero { padding: 4rem 2rem 4rem; }
    .grid-wrap { height: 42%; perspective: 200px; }
    .stars { inset: 0 0 42% 0; }

    .inner {
      max-width: 1100px;
      flex-direction: row;
      justify-content: center;
      gap: 3.5rem;
      text-align: left;
    }
    .text-col { display: flex; flex-direction: column; align-items: flex-start; }

    .orb { width: 400px; height: 400px; }
    .halo { width: 460px; height: 460px; }

    .greeting { margin-top: 0; font-size: 0.9rem; }
    .name { font-size: 4.25rem; }
    .pill { font-size: 1rem; padding: .85rem 1.75rem; flex-wrap: nowrap; justify-content: flex-start; }
    .cta { font-size: 1.05rem; }

    .scroll { position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%); margin: 0; }
  }

  /* ============ REDUCED MOTION ============ */
  @media (prefers-reduced-motion: reduce) {
    .grid, .stars, .chev, .orb, .orb::before, .halo { animation: none; }
  }
</style>
</head>
<body>

<section class="hero">
  <div class="stars"></div>
  <div class="grid-wrap"><div class="grid"></div></div>

  <div class="inner">
    <div class="orb-wrap">
      <div class="halo"></div>
      <div class="orb"><img src="image.png" alt="Nourah Alotaibi"></div>
    </div>

    <div class="text-col">
      <h1>
        <span class="greeting">Hello, I'm</span><br>
        <span class="name">Nourah Alotaibi <span class="wave">👋🏻</span></span>
      </h1>

      <div class="pill">
        <span>💻</span><span>Computer Engineer</span>
        <span class="divider">│</span>
        <span>🧠</span><span>AI Developer</span>
      </div>

      <button class="cta"><span>✦</span> Explore My Journey <span>→</span></button>
    </div>
  </div>

  <div class="scroll">
    <span>SCROLL TO EXPLORE</span>
    <span class="chev">⌄</span>
    <span class="chev">⌄</span>
  </div>
</section>

</body>
</html>
